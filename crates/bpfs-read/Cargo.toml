[package]
name = "bpfs-read"
version = "0.1.0"
edition = "2021"
description = "BPFS reader: parses and verifies BPFS archives, provides access to contents"
authors.workspace = true
license.workspace = true

[dependencies]
bpfs-core = { path = "../bpfs-core" }

anyhow     = "1"
thiserror  = "1"
sha2       = "0.10"
memmap2    = "0.9"
byteorder  = "1.5"
ed25519-dalek = "2"

# Compression backends (match packer)
brotli     = { version = "8", optional = true }
lz4        = { version = "1.28", optional = true }
zstd       = { version = "0.13", optional = true, default-features = false }

[features]
default = ["compression-brotli"]

compression-brotli = ["dep:brotli"]
compression-lz4    = ["dep:lz4"]
compression-zstd   = ["dep:zstd"]

[dev-dependencies]
bpfs-pack = { path = "../bpfs-pack" }
tempfile = "3"
rand = "0.8"
