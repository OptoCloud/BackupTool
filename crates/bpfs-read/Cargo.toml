[package]
name = "bpfs-read"
version = "0.1.0"
edition = "2021"
description = "BPFS reader: parses and verifies BPFS archives, provides access to contents"
authors.workspace = true
license.workspace = true

[dependencies]
bpfs-core = { path = "../bpfs-core" }

anyhow     = "1"
thiserror  = "2"
sha2       = "0.11"
memmap2    = "0.9"
ed25519-dalek = "3"

# Compression backends (match packer)
brotli     = { version = "9", optional = true }
lz4_flex = { version = "0.14", optional = true }
zstd       = { version = "0.14", optional = true, default-features = false }

[features]
default = ["compression-brotli"]

compression-brotli = ["dep:brotli"]
compression-lz4    = ["dep:lz4_flex"]
compression-zstd   = ["dep:zstd"]

[dev-dependencies]
bpfs-pack = { path = "../bpfs-pack" }
tempfile = "3"
rand = "0.10"
