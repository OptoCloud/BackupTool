[package]
name = "bpfs-pack"
version = "0.1.0"
edition = "2021"
description = "BPFS packer: scans directories, deduplicates, and writes BPFS archives"
authors.workspace = true
license.workspace = true

[dependencies]
bpfs-core = { path = "../bpfs-core" }

ed25519-dalek = "3"
anyhow     = "1"
thiserror  = "2"
sha2       = "0.11"
rayon      = { version = "1.10", optional = true }
filetime   = "0.2"
walkdir    = "2"

# Compression backends
brotli     = "9"
lz4_flex = { version = "0.14", optional = true }
zstd       = { version = "0.14", default-features = false }

[features]
default = ["multithread"]

compression-lz4    = ["dep:lz4_flex"]

multithread = ["dep:rayon"]
portable-names = []
fast-probes = []

[dev-dependencies]
tempfile = "3"
