[package]
name = "bpfs-pack"
version = "0.1.0"
edition = "2021"
description = "BPFS packer: scans directories, deduplicates, and writes BPFS archives"
authors.workspace = true
license.workspace = true

[dependencies]
bpfs-core = { path = "../bpfs-core" }

ed25519-dalek = "3"
anyhow     = "1"
thiserror  = "2"
sha2       = "0.11"
rayon      = { version = "1.10", optional = true }
filetime   = "0.2"
walkdir    = "2"
memmap2    = "0.9"

# Compression backends
brotli     = { version = "9", optional = true }
lz4_flex = { version = "0.14", optional = true }
zstd       = { version = "0.14", optional = true, default-features = false, features = ["zstdmt"] }

[features]
default = ["compression-brotli", "multithread"]

compression-brotli = ["dep:brotli"]
compression-lz4    = ["dep:lz4_flex"]
compression-zstd   = ["dep:zstd"]

multithread = ["dep:rayon"]
portable-names = []
fast-probes = []

[dev-dependencies]
tempfile = "3"
