[package]
name = "bpfs-pack"
version = "0.1.0"
edition = "2021"
description = "BPFS packer: scans directories, deduplicates, and writes BPFS archives"
authors.workspace = true
license.workspace = true

[dependencies]
bpfs-core = { path = "../bpfs-core" }

ed25519-dalek = "2"
anyhow     = "1"
thiserror  = "1"
sha2       = "0.10"
rayon      = { version = "1.10", optional = true }
filetime   = "0.2"
walkdir    = "2"
memmap2    = "0.9"
byteorder  = "1.5"

# Compression backends
brotli     = { version = "8", optional = true }
lz4        = { version = "1.28", optional = true }
zstd       = { version = "0.13", optional = true, default-features = false, features = ["zstdmt"] }

[features]
default = ["compression-brotli", "multithread"]

compression-brotli = ["dep:brotli"]
compression-lz4    = ["dep:lz4"]
compression-zstd   = ["dep:zstd"]

multithread = ["dep:rayon"]
portable-names = []
fast-probes = []

[dev-dependencies]
tempfile = "3"
